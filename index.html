function StarRating({ rating }) {

function ScoreCard({ company }) {
  const c = COMPANIES[company];

      <h2><a href={c.url} target="_blank" rel="noopener" style={{color:"var(--accent)",textDecoration:"none"}}>{c.name}</a></h2>
      <div style={{display:"flex",gap:"24px",alignItems:"center"}}>

        <div style={{flex:1}}>

  );
}

function ReviewCard({ r }) {
  const cls = r.sentiment === "Negative" ? "neg" : r.sentiment === "Mixed" ? "mix" : "pos";

  return (
    <div className={`review-card ${cls}`}>
      <div className="review-header">
        <span>
          <span className="review-author">{r.author}</span>
          <span style={{margin:"0 8px"}}><StarRating rating={r.rating} /></span>
          <span className={`badge ${badgeCls}`}>{r.sentiment}</span>
          {r.companyReplied ? <span className="badge badge-replied">Replied</span> : r.rating <= 2 ? <span className="badge badge-unreplied">â  Unreplied</span> : null}
        </span>
        <span className="review-date">{r.date} Â· {r.platform}</span>
      </div>
      {r.title && <div className="review-title">{r.title}</div>}
      <div className="review-body">{r.originalText || r.summary}</div>

}

          <h2>ð Quick Stats â Elite Ecom</h2>
          <div className="stat-grid">
            <div className="stat"><div className="stat-val" style={{color:"var(--green)"}}>{ELITE_ECOM_REVIEWS.length}</div><div className="stat-label">Tracked Reviews</div></div>
            <div className="stat"><div className="stat-val" style={{color:"var(--green)"}}>{ELITE_ECOM_REVIEWS.filter(r=>r.rating>=4).length}</div><div className="stat-label">Positive (4-5â)</div></div>
            <div className="stat"><div className="stat-val" style={{color:"var(--red)"}}>{ELITE_ECOM_REVIEWS.filter(r=>r.rating<=2).length}</div><div className="stat-label">Negative (1-2â)</div></div>
            <div className="stat"><div className="stat-val" style={{color:eeNeg>0?"var(--red)":"var(--green)"}}>{eeNeg}</div><div className="stat-label">Unreplied Negative</div></div>
          </div>
        </div>
        <div className="card">
          <h2>ð Quick Stats â Infinity Hoop</h2>
          <div className="stat-grid">
            <div className="stat"><div className="stat-val" style={{color:"var(--accent)"}}>{INFINITY_HOOP_REVIEWS.length}</div><div className="stat-label">Tracked Reviews</div></div>
            <div className="stat"><div className="stat-val" style={{color:"var(--green)"}}>{INFINITY_HOOP_REVIEWS.filter(r=>r.rating>=4).length}</div><div className="stat-label">Positive (4-5â)</div></div>
            <div className="stat"><div className="stat-val" style={{color:"var(--red)"}}>{INFINITY_HOOP_REVIEWS.filter(r=>r.rating<=2).length}</div><div className="stat-label">Negative (1-2â)</div></div>
            <div className="stat"><div className="stat-val" style={{color:ihNeg>0?"var(--red)":"var(--green)"}}>{ihNeg}</div><div className="stat-label">Unreplied Negative</div></div>
          </div>
        </div>
      </div>

      {unrepliedNeg.length > 0 && (
        <div className="flag-section">
          <h2>ð¨ Unreplied Negative Reviews â Action Needed ({unrepliedNeg.length})</h2>
          <div style={{marginTop:"12px"}}>
            {unrepliedNeg.map(r => <ReviewCard key={r.id} r={r} />)}
          </div>
        </div>
      )}

      <div className="card" style={{marginBottom:"24px"}}>
        <h2>All Reviews ({filtered.length})</h2>
        <div className="filter-row">
          <div className="tabs">
            {["all","Elite Ecom","Infinity Hoop"].map(c => (
              <button key={c} className={`tab ${activeCompany===c?"active":""}`} onClick={()=>setActiveCompany(c)}>{c==="all"?"All Companies":c}</button>
            ))}
          </div>
          <select value={ratingFilter} onChange={e=>setRatingFilter(e.target.value)}>
            <option value="all">All Ratings</option>
            {[5,4,3,2,1].map(r => <option key={r} value={r}>{r} Star{r>1?"s":""}</option>)}
          </select>
          <select value={sentimentFilter} onChange={e=>setSentimentFilter(e.target.value)}>
            <option value="all">All Sentiment</option>
            <option value="Positive">Positive</option>
            <option value="Mixed">Mixed</option>
            <option value="Negative">Negative</option>
          </select>
          <input className="search-input" placeholder="Search reviews..." value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
        {filtered.map(r => <ReviewCard key={r.id} r={r} />)}
      </div>
      <div className="updated">Last scraped: {LAST_UPDATED} Â· Data from Trustpilot</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
